<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
	<defs>
		<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4f46e5"/>
			<stop offset="0.55" stop-color="#7c3aed"/>
			<stop offset="1" stop-color="#c026d3"/>
		</linearGradient>
		<radialGradient id="glowA" cx="0.12" cy="-0.1" r="0.75">
			<stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowB" cx="0.85" cy="1.05" r="0.7">
			<stop offset="0" stop-color="#4f46e5" stop-opacity="0.6"/>
			<stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="1124" y1="0" x2="1250" y2="0">
			<stop offset="0" stop-color="#a5b4fc" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#c4b5fd" stop-opacity="0.9"/>
		</linearGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7c3aed" flood-opacity="0.55"/>
		</filter>
	</defs>

	<!-- Background -->
	<rect width="1544" height="500" fill="#0b1023"/>
	<rect width="1544" height="500" fill="url(#grid)"/>
	<rect width="1544" height="500" fill="url(#glowA)"/>
	<rect width="1544" height="500" fill="url(#glowB)"/>

	<!-- Left: logo + wordmark -->
	<g transform="translate(110 118)">
		<rect width="132" height="132" rx="30" fill="url(#brand)" filter="url(#shadow)"/>
		<g transform="translate(15 13) scale(4.25)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<rect x="3" y="4" width="18" height="15" rx="2.5" fill="#fff" fill-opacity="0.12"/>
			<circle cx="12" cy="11.5" r="3.5"/>
			<path d="M12 8v1.2M12 13.8V15M8.5 11.5h1.2M14.3 11.5h1.2"/>
			<path d="M7 19v1.5M17 19v1.5"/>
		</g>
	</g>
	<g font-family="'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif">
		<text x="276" y="198" fill="#fff" font-size="92" font-weight="800" letter-spacing="-2.5">Packvault</text>
		<text x="280" y="252" fill="#c7d2fe" font-size="34" font-weight="500">Backup, Restore &amp; Migration</text>
	</g>

	<!-- Feature chips -->
	<g font-family="'Segoe UI Variable Text','Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="600" fill="#e0e7ff">
		<g transform="translate(110 318)">
			<rect width="252" height="52" rx="26" fill="#fff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.35"/>
			<circle cx="28" cy="26" r="6" fill="#2dd4bf"/>
			<text x="46" y="34">One portable file</text>
		</g>
		<g transform="translate(378 318)">
			<rect width="196" height="52" rx="26" fill="#fff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.35"/>
			<circle cx="28" cy="26" r="6" fill="#a78bfa"/>
			<text x="46" y="34">Any size</text>
		</g>
		<g transform="translate(590 318)">
			<rect width="196" height="52" rx="26" fill="#fff" fill-opacity="0.08" stroke="#a5b4fc" stroke-opacity="0.35"/>
			<circle cx="28" cy="26" r="6" fill="#f0abfc"/>
			<text x="46" y="34">Any host</text>
		</g>
	</g>

	<!-- Right: site parts flowing into one .packvault file -->
	<g font-family="'Segoe UI Variable Text','Segoe UI',Inter,Arial,sans-serif">
		<!-- Source items -->
		<g fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12">
			<path d="M1124 130 C1200 130 1190 250 1250 250"/>
			<path d="M1124 250 H1250"/>
			<path d="M1124 370 C1200 370 1190 250 1250 250"/>
		</g>
		<g font-size="22" font-weight="600" fill="#e0e7ff">
			<g transform="translate(866 98)">
				<rect width="250" height="64" rx="16" fill="#fff" fill-opacity="0.07" stroke="#a5b4fc" stroke-opacity="0.3"/>
				<g transform="translate(18 18)" fill="none" stroke="#5eead4" stroke-width="2.2">
					<ellipse cx="14" cy="5" rx="12" ry="4.5"/>
					<path d="M2 5v18c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5V5M2 14c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5"/>
				</g>
				<text x="62" y="40">Database</text>
			</g>
			<g transform="translate(866 218)">
				<rect width="250" height="64" rx="16" fill="#fff" fill-opacity="0.07" stroke="#a5b4fc" stroke-opacity="0.3"/>
				<g transform="translate(18 18)" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linejoin="round">
					<rect x="1" y="2" width="26" height="24" rx="4"/>
					<circle cx="9" cy="10" r="3"/>
					<path d="M1 22l8-7 6 5 5-4 7 6"/>
				</g>
				<text x="62" y="40">Media</text>
			</g>
			<g transform="translate(866 338)">
				<rect width="250" height="64" rx="16" fill="#fff" fill-opacity="0.07" stroke="#a5b4fc" stroke-opacity="0.3"/>
				<g transform="translate(18 18)" fill="none" stroke="#f0abfc" stroke-width="2.2" stroke-linejoin="round">
					<rect x="1" y="1" width="11" height="11" rx="2.5"/>
					<rect x="16" y="1" width="11" height="11" rx="2.5"/>
					<rect x="1" y="16" width="11" height="11" rx="2.5"/>
					<rect x="16" y="16" width="11" height="11" rx="2.5"/>
				</g>
				<text x="62" y="40">Plugins &amp; themes</text>
			</g>
		</g>

		<!-- The .packvault file -->
		<g transform="translate(1250 120)">
			<path d="M0 22 A22 22 0 0 1 22 0 H150 L200 50 V238 A22 22 0 0 1 178 260 H22 A22 22 0 0 1 0 238 Z" fill="url(#brand)" filter="url(#shadow)"/>
			<path d="M150 0 V34 A16 16 0 0 0 166 50 H200 Z" fill="#fff" fill-opacity="0.3"/>
			<g transform="translate(46 50) scale(4.4)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
				<rect x="3" y="4" width="18" height="15" rx="2.5" fill="#fff" fill-opacity="0.12"/>
				<circle cx="12" cy="11.5" r="3.5"/>
				<path d="M12 8v1.2M12 13.8V15M8.5 11.5h1.2M14.3 11.5h1.2"/>
				<path d="M7 19v1.5M17 19v1.5"/>
			</g>
			<rect x="30" y="192" width="140" height="40" rx="12" fill="#0b1023" fill-opacity="0.35"/>
			<text x="100" y="220" text-anchor="middle" fill="#fff" font-size="23" font-weight="700" font-family="Consolas,'Cascadia Mono',monospace">.packvault</text>
		</g>
	</g>
</svg>
